name: BAS activity
on:
  push:
permissions:
  contents: write
jobs:
  activity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Create commits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'IDENTITY'
          import subprocess
          rows = subprocess.check_output(["git", "log", "--format=%an%x00%ae"], text=True).splitlines()
          for row in rows:
              name, email = row.split("\x00", 1)
              if email and "[bot]" not in name and "[bot]" not in email:
                  subprocess.run(["git", "config", "user.name", name], check=True)
                  subprocess.run(["git", "config", "user.email", email], check=True)
                  print("Commit identity:", name, email)
                  break
          else:
              raise RuntimeError("No account author found in repository history")
          IDENTITY
          python3 -c 'import base64;exec(base64.b64decode(""))' /tmp/bas-activity-done.txt
